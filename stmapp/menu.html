<script src="js/app.js"></script>
<script>
  const { MENU_ITEMS, CATEGORIES, Cart, showToast } = window.STMApp;

  let activeCategory = 'all';
  let searchQuery = '';

  /* â”€â”€ Read URL param â”€â”€ */
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('cat')) activeCategory = urlParams.get('cat');

  /* â”€â”€ Category Chips â”€â”€ */
  const chipContainer = document.getElementById('cat-chips');
  CATEGORIES.forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'category-chip' + (cat.id === activeCategory ? ' active' : '');
    chip.dataset.id = cat.id;
    chip.innerHTML = `<span class="chip-emoji">${cat.emoji}</span> ${cat.name}`;
    chip.onclick = () => {
      activeCategory = cat.id;
      document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      // Scroll chip into view
      chip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      renderMenu();
    };
    chipContainer.appendChild(chip);
  });

  /* â”€â”€ Search Input â”€â”€ */
  const searchInput = document.getElementById('menu-search');
  const clearSearchBtn = document.getElementById('clear-search');
  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value.trim().toLowerCase();
    clearSearchBtn.style.display = searchQuery ? 'block' : 'none';
    renderMenu();
  });

  function clearSearch() {
    searchInput.value = '';
    searchQuery = '';
    clearSearchBtn.style.display = 'none';
    renderMenu();
  }

  function resetSearch() {
    clearSearch();
    activeCategory = 'all';
    document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
    chipContainer.children[0].classList.add('active');
    renderMenu();
  }

  /* â”€â”€ Render Menu â”€â”€ */
  function renderMenu() {
    const filtered = MENU_ITEMS.filter(item => {
      const matchCat = activeCategory === 'all' || item.category === activeCategory;
      const matchSearch = !searchQuery ||
        item.name.toLowerCase().includes(searchQuery) ||
        (item.description || '').toLowerCase().includes(searchQuery);
      return matchCat && matchSearch;
    });

    const list = document.getElementById('menu-list');
    const empty = document.getElementById('menu-empty');

    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = filtered.map(item => {
      const qty = Cart.getItems().find(i => i.id === item.id)?.qty || 0;
      const badgeMap = { bestseller: 'â­ Bestseller', new: 'âœ¨ New', spicy: 'ðŸŒ¶ Spicy' };
      return `
        <div class="menu-card" data-id="${item.id}">
          <div class="menu-card-img-wrap">
            <img class="menu-card-img" src="${item.img}" alt="${item.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=300'" />
            ${item.badge ? `<span class="item-badge badge-${item.badge}">${badgeMap[item.badge] || item.badge}</span>` : ''}
          </div>
          <div class="menu-card-body">
            <div class="menu-card-name">${item.name}</div>
            <div class="menu-card-desc">${item.description || 'Freshly prepared with authentic STM Salam flavours.'}</div>
            <div class="menu-card-meta">
              <span class="meta-pill">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${item.prepTime || 15} min
              </span>
              ${item.category === 'indian' ? '<span class="meta-pill">9AMâ€“9PM</span>' : ''}
            </div>
            <div class="menu-card-footer">
              <span class="item-price">SGD ${item.price.toFixed(2)}</span>
              ${qty > 0 ? `
                <div class="qty-control" id="qty-${item.id}">
                  <button class="qty-btn" onclick="changeQty(${item.id},-1)">âˆ’</button>
                  <span class="qty-value">${qty}</span>
                  <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
                </div>` : `
                <button class="add-btn" id="add-${item.id}" onclick="addItem(${item.id})" aria-label="Add ${item.name}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>`}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function addItem(id) {
    const item = MENU_ITEMS.find(i => i.id === id);
    if (!item) return;
    Cart.add(item);
    showToast(`${item.name} added! ðŸ›’`, 'success', 2000);
    renderMenu();
  }

  function changeQty(id, delta) {
    Cart.updateQty(id, delta);
    renderMenu();
  }

  /* â”€â”€ Filter Drawer (placeholder) â”€â”€ */
  function toggleFilterDrawer() {
    showToast('Filter coming soon!', 'default', 1500);
  }

  renderMenu();
</script>
</body>
